name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check for missing migrations
        # Catches the classic "changed a model, forgot to make the migration" review comment
        # before a human has to make it.
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-key-not-used-to-protect-anything-x7f2q9m4z8

      - name: Check the OpenAPI schema still generates
        run: python manage.py spectacular --fail-on-warn --file /dev/null

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t data-structure-management-service .

      - name: Run the test suite inside the image
        run: docker run --rm data-structure-management-service pytest -q
